name: Audit checkpoint

# Exports a verified audit hash-chain checkpoint for staging OUTSIDE Supabase,
# as a GitHub Actions artifact (one new artifact per run; never overwritten).
# Each run fetches the previous checkpoint and proves the chain still contains
# its head (no history rewritten). See docs/audit-checkpoints.md.
#
# Scheduled and manual runs use the workflow file on the default branch (main).
on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to download the previous checkpoint artifact

concurrency:
  group: audit-checkpoint-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      AUDIT_CHECKPOINT_SIGNING_KEY: ${{ secrets.AUDIT_CHECKPOINT_SIGNING_KEY }}
      AUDIT_ENVIRONMENT: staging
      AUDIT_CHECKPOINT_DIR: audit-checkpoints
    steps:
      - name: Require configuration
        run: |
          [ -n "$SUPABASE_URL" ] || { echo "::error::Set the staging environment variable STAGING_SUPABASE_URL"; exit 1; }
          [ -n "$SUPABASE_SECRET_KEY" ] || { echo "::error::Set the staging environment secret STAGING_SUPABASE_SECRET_KEY"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the previous checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$AUDIT_CHECKPOINT_DIR"
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow audit-checkpoint.yml --status success --limit 1 \
                   --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -R "$GITHUB_REPOSITORY" -D previous || true
            latest=$(find previous -name 'audit-checkpoint-staging-*.json' 2>/dev/null | sort | tail -1)
            [ -n "$latest" ] && cp "$latest" "$AUDIT_CHECKPOINT_DIR/" && echo "Previous checkpoint: $(basename "$latest")"
          else
            echo "No previous checkpoint (first run)."
          fi
      - name: Verify chains and write checkpoint
        run: npm run audit:checkpoint 2>&1 | tee checkpoint.log
        shell: bash -o pipefail {0}
      - name: Upload checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-checkpoint-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AUDIT_CHECKPOINT_DIR }}/
          retention-days: 90
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: |
          { echo '### Audit checkpoint (staging)'; echo '```'; cat checkpoint.log 2>/dev/null || echo "no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
