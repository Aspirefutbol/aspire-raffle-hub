name: Repair Next security dependency (feature only)

# One-purpose repair lane. No production environment, database credentials,
# migrations, deployment, merge, force push, or audit bypass is permitted.
# Remove this workflow after the dependency-only commit has been reviewed.
on:
  push:
    branches: [feat/phase-1-fundraising-slice]
    paths: [.github/workflows/repair-next-security.yml]
  workflow_dispatch:

concurrency:
  group: raffle-next-security-repair
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'Aspirefutbol/aspire-raffle-hub' && github.ref == 'refs/heads/feat/phase-1-fundraising-slice'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TARGET_BRANCH: feat/phase-1-fundraising-slice
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile for the verified patched versions
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.2
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@16.4.2
      - name: Verify only the approved manifest entries changed
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const expected = JSON.parse(execFileSync('git', ['show', `${process.env.GITHUB_SHA}:package.json`], { encoding: 'utf8' }));
          expected.dependencies.next = '16.4.2';
          expected.devDependencies['eslint-config-next'] = '16.4.2';
          assert.deepEqual(JSON.parse(readFileSync('package.json', 'utf8')), expected);
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(lock.packages[''].dependencies.next, '16.4.2');
          assert.equal(lock.packages[''].devDependencies['eslint-config-next'], '16.4.2');
          assert.equal(lock.packages['node_modules/next'].version, '16.4.2');
          assert.equal(lock.packages['node_modules/eslint-config-next'].version, '16.4.2');
          NODE
      - name: Install the regenerated lockfile without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Production dependency audit remains mandatory
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build with placeholder configuration
        run: npm run build
      - name: Commit only the two reviewed dependency files to the same feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').sort();
          assert.deepEqual(changed, ['package-lock.json', 'package.json']);
          NODE
          git diff --check
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo '::error::Feature branch moved during validation. No commit was pushed.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git commit -m 'fix(deps): pin Next.js 16.4.2 security release'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          {
            echo '## Dependency repair committed to the feature branch only'
            echo "Commit: $(git rev-parse HEAD)"
            echo 'Verified: audit, lint, typecheck, unit tests, and placeholder build.'
            echo 'Not verified here: database tests, browser E2E, or hosted QA.'
            echo 'A fresh exact-commit full CI and Hosted QA run is still required.'
            echo 'Production and PR draft/unmerged status were not changed.'
          } >> "$GITHUB_STEP_SUMMARY"
