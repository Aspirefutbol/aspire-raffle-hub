name: Staging

# Deploys main to the hosted staging stack: hosted Supabase (migrations + pgTAP
# against the real database) then Netlify. Configure the "staging" environment
# secrets first — see docs/deployment.md. Nothing here runs without them.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - name: Require staging configuration
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD STAGING_PROJECT_REF STAGING_DB_URL NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID STAGING_URL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing staging secrets/vars:$missing (see docs/deployment.md)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Link hosted project
        run: npx supabase link --project-ref "$STAGING_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        run: npx supabase migration list
      - name: Apply migrations
        run: npx supabase db push --include-all
      - name: Hosted pgTAP (runs in transactions, rolled back)
        run: npx supabase test db --db-url "$STAGING_DB_URL"
      - name: Deploy to Netlify
        run: npx netlify-cli@17 deploy --build --prod --site "$NETLIFY_SITE_ID" --message "staging ${GITHUB_SHA::7}"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke-test staging
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npx playwright test e2e/smoke.spec.ts --project=desktop
