name: Isolated Parent Campaign Choice Acceptance 2026-10-29

on:
  push:
    branches: [feat/parent-campaign-choice-isolation-20261029]

concurrency:
  group: isolated-parent-campaign-choice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  database:
    name: Database (migrations, pgTAP, types) + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply every migration from scratch
        run: npx supabase db reset
      - name: pgTAP (RLS, permissions, lifecycle, ledgers, audit chain)
        run: npx supabase test db
      - name: Database lint
        run: npx supabase db lint --local --level error --fail-on error
      - name: Generated types are current
        run: |
          npm run db:types
          git diff --exit-code lib/database/types.gen.ts
      - name: Seed + env
        run: |
          ./scripts/ci-env.sh
          npm run seed:dev
      - name: Unit tests incl. DB catalog parity
        run: npm test
      - name: Concurrent raffle sales, stock, reversals, and closure
        run: |
          set -a && . ./.env.local && set +a
          npm run test:concurrency
          npm run test:package-concurrency
      - name: Concurrent drawing freeze, reversal, reopening, and certification
        run: |
          set -a && . ./.env.local && set +a
          npm run test:drawing-concurrency
      - name: Concurrent money receipts, reversals, checks, refunds, and credits
        run: |
          set -a && . ./.env.local && set +a
          npm run test:money-concurrency
      - name: Concurrent seller links, public retries, and revocation
        run: npm run test:sharing-concurrency
      - name: Restore fresh E2E fixtures after concurrency organizations
        run: |
          npx supabase db reset --local
          ./scripts/ci-env.sh
          npm run seed:dev
      - name: Audit checkpoint (verify chains, export, then prove continuity)
        run: |
          AUDIT_ENVIRONMENT=ci npm run audit:checkpoint
          AUDIT_ENVIRONMENT=ci npm run audit:checkpoint
      - name: Build
        run: set -a && . ./.env.local && set +a && npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (Phase 0, raffle slice, and 360px family/touch targets)
        run: |
          set -a && . ./.env.local && set +a
          npm run start > next.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000/login
          E2E_BASE_URL=http://localhost:3000 npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            next.log
