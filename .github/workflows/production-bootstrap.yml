name: Production Bootstrap

# Manual-only production database migration lane.
# Runs only from merged main. No seed/reset/test fixtures. Applies tracked migrations exactly as committed.
on:
  workflow_dispatch:

concurrency:
  group: production-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      PRODUCTION_PROJECT_REF: bsjjzewifpbngbasdvew

    steps:
      - name: Require production credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing PRODUCTION_SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing PRODUCTION_DB_PASSWORD"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Link production project
        run: npx supabase link --project-ref "$PRODUCTION_PROJECT_REF"

      - name: Preview pending production migrations
        run: |
          npx supabase migration list --linked
          npx supabase db push --linked --dry-run

      - name: Preflight production schema lint
        run: npx supabase db lint --linked --level error

      - name: Apply tracked migrations only
        run: npx supabase db push --linked --yes

      - name: Verify migration history
        run: npx supabase migration list --linked

      - name: Verify production schema matches committed TypeScript contract
        run: |
          npx supabase gen types typescript --linked > /tmp/types.gen.ts
          diff -u lib/database/types.gen.ts /tmp/types.gen.ts

      - name: Post-migration production schema lint
        run: npx supabase db lint --linked --level error

      - name: Verify production security advisors
        run: |
          code="$(curl -sS -o /tmp/security-advisors.json -w "%{http_code}"             "https://api.supabase.com/v1/projects/$PRODUCTION_PROJECT_REF/advisors/security?lint_type=sql"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          if [ "$code" != "200" ]; then
            echo "::error::Could not read Supabase Security Advisors (HTTP $code)."
            exit 1
          fi
          node - <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/security-advisors.json", "utf8"));
          const lints = payload.lints || [];
          const blockers = lints.filter((lint) =>
            String(lint.level || "").toUpperCase() === "ERROR" ||
            lint.name === "auth_leaked_password_protection"
          );
          if (blockers.length) {
            console.error("Production security advisor blockers:", blockers.map((lint) => lint.name));
            process.exit(1);
          }
          console.log("Production Security Advisors contain no blocking ERROR lint and leaked-password protection is enabled.");
          NODE
