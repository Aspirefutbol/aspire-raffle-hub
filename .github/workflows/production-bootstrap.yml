name: Production Bootstrap

# Manual-only production database migration lane.
# Runs only from merged main. No seed/reset/test fixtures. Applies tracked migrations exactly as committed.
on:
  workflow_dispatch:

concurrency:
  group: production-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      PRODUCTION_PROJECT_REF: bsjjzewifpbngbasdvew

    steps:
      - name: Require production credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing PRODUCTION_SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing PRODUCTION_DB_PASSWORD"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require this main commit to come from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged_pr_count=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
          if [ "$merged_pr_count" -lt 1 ]; then
            echo "::error::Production commits must reach main through a merged pull request. Direct-push commits are not eligible for production workflows."
            exit 1
          fi
          echo "Verified: this production commit is associated with a merged pull request to main."

      - name: Wait for full CI on this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            result=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] | if .status == "completed" then .conclusion else "pending" end')
            if [ "$result" = success ]; then exit 0; fi
            if [ "$result" != pending ] && [ -n "$result" ] && [ "$result" != null ]; then
              echo "::error::CI did not pass for production migration commit: $result"
              exit 1
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for production commit CI"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve production session-pooler connection
        run: |
          code="$(curl -sS -o /tmp/pooler.json -w "%{http_code}"             "https://api.supabase.com/v1/projects/$PRODUCTION_PROJECT_REF/config/database/pooler"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          if [ "$code" != "200" ]; then
            echo "::error::Could not read production Supavisor configuration (HTTP $code)."
            exit 1
          fi

          pooler_host="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/pooler.json","utf8"));const h=x.db_host||x.host||x.pooler_host||x.pooler?.db_host||x.primary?.db_host;if(!h)process.exit(1);process.stdout.write(h)')"
          if [ -z "$pooler_host" ]; then
            echo "::error::Production Supavisor response did not contain a pooler host."
            exit 1
          fi

          db_url="$(POOLER_HOST="$pooler_host" node -e 'const p=encodeURIComponent(process.env.SUPABASE_DB_PASSWORD);const u=encodeURIComponent("postgres."+process.env.PRODUCTION_PROJECT_REF);process.stdout.write("postgresql://"+u+":"+p+"@"+process.env.POOLER_HOST+":5432/postgres?sslmode=require")')"
          echo "::add-mask::$db_url"
          echo "PRODUCTION_DB_URL=$db_url" >> "$GITHUB_ENV"

      - name: Preview pending production migrations
        run: |
          npx supabase migration list --db-url "$PRODUCTION_DB_URL"
          npx supabase db push --db-url "$PRODUCTION_DB_URL" --dry-run

      - name: Apply tracked migrations only
        run: npx supabase db push --db-url "$PRODUCTION_DB_URL" --yes

      - name: Verify migration history
        run: npx supabase migration list --db-url "$PRODUCTION_DB_URL"

      - name: Verify production schema matches committed TypeScript contract
        run: |
          npx supabase gen types typescript --db-url "$PRODUCTION_DB_URL" > /tmp/types.gen.ts
          diff -u lib/database/types.gen.ts /tmp/types.gen.ts

      - name: Verify production security advisors
        run: |
          code="$(curl -sS -o /tmp/security-advisors.json -w "%{http_code}"             "https://api.supabase.com/v1/projects/$PRODUCTION_PROJECT_REF/advisors/security?lint_type=sql"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          if [ "$code" != "200" ]; then
            echo "::error::Could not read Supabase Security Advisors (HTTP $code)."
            exit 1
          fi
          node - <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/security-advisors.json", "utf8"));
          const lints = payload.lints || [];
          const allowedAnonSecurityDefiners = new Set([
            "public_seller_page",
            "submit_seller_interest_request",
          ]);
          const unexpectedAnon = lints
            .filter((lint) => lint.name === "anon_security_definer_function_executable")
            .flatMap((lint) => lint.findings || [])
            .filter((finding) => !allowedAnonSecurityDefiners.has(finding.metadata?.name));
          const blockers = lints.filter((lint) =>
            String(lint.level || "").toUpperCase() === "ERROR" ||
            lint.name === "auth_leaked_password_protection"
          );
          if (blockers.length || unexpectedAnon.length) {
            console.error("Production security advisor blockers:", blockers.map((lint) => lint.name));
            console.error("Unexpected anonymous SECURITY DEFINER functions:", unexpectedAnon.map((finding) => finding.metadata?.name));
            process.exit(1);
          }
          console.log("Production Security Advisors contain no blocking ERROR lint, leaked-password protection is enabled, and anonymous privileged RPCs match the approved allowlist.");
          NODE
